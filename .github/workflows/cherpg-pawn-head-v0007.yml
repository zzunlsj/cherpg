name: CheRPG Pawn Head Refinement v0.0.7
on:
  push:
    branches: [main]
    paths:
      - 'production/pawn_protagonist/modeling/head_refinement_v0007.py'
      - '.github/workflows/cherpg-pawn-head-v0007.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sculpt:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cherpg-blender/blender-5.2.2-linux-x64
          key: blender-5.2.2-linux-x64
      - name: Prepare Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libx11-6 libxext6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 xvfb
          ROOT="$HOME/.cache/cherpg-blender";BIN="$ROOT/blender-5.2.2-linux-x64/blender"
          if [ ! -x "$BIN" ];then
            mkdir -p "$ROOT"
            curl -fL -o "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
            tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$ROOT"
          fi
          echo "BLENDER_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Refine organic facial relief and render views
        shell: bash
        run: |
          set -euo pipefail
          OUT=production/pawn_protagonist/build/face-v0.0.7
          mkdir -p "$OUT"
          SRC=production/pawn_protagonist/modeling/checkpoints/pawn-head-shapes-v0.0.6.blend
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_BIN" --background "$SRC" --python production/pawn_protagonist/modeling/head_refinement_v0007.py -- "$SRC" "$OUT"
          test -s "$OUT/pawn-head-shapes-v0.0.7.blend"
          for a in front profile threequarter face-detail ear-detail; do test -s "$OUT/pawn-head-shapes-v0.0.7-$a.png"; done
          python - <<'PY'
          import json
          with open("production/pawn_protagonist/build/face-v0.0.7/report.json") as f:r=json.load(f)
          assert r["eye_objects"]==[] and r["eye_policy"]=="only outline, no eyeballs"
          assert r["max_displacement_m"]<0.008 and r["approved"] is False
          PY
      - name: Publish actual Blender checkpoint and renders
        shell: bash
        run: |
          set -euo pipefail
          OUT=production/pawn_protagonist/build/face-v0.0.7
          cp "$OUT/pawn-head-shapes-v0.0.7.blend" production/pawn_protagonist/modeling/checkpoints/
          cp "$OUT"/*.png production/pawn_protagonist/renders/
          cp "$OUT/report.json" production/pawn_protagonist/renders/face-v0.0.7-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/pawn_protagonist/modeling/checkpoints/pawn-head-shapes-v0.0.7.blend production/pawn_protagonist/renders
          if ! git diff --cached --quiet; then
            git commit -m "Publish actual Pawn head v0.0.7 detail pass and five renders"
            git push origin HEAD:main
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pawn-head-shapes-v0.0.7-model-renders
          path: production/pawn_protagonist/build/face-v0.0.7/*
          retention-days: 30
