name: CheRPG Pawn v0.5.4 Multi View Preview

on:
  push:
    branches:
      - cherpg-blender-pipeline
    paths:
      - 'cherpg_pipeline/render_multi_preview_v054.py'
      - '.github/workflows/cherpg-blender-multipreview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cherpg-blender/blender-5.2.2-linux-x64
          key: blender-5.2.2-linux-x64
      - name: Prepare headless Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libx11-6 libxext6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 xvfb
          ROOT="$HOME/.cache/cherpg-blender"
          BIN="$ROOT/blender-5.2.2-linux-x64/blender"
          if [ ! -x "$BIN" ]; then
            mkdir -p "$ROOT"; cd "$ROOT"
            curl -fL --retry 3 --retry-delay 5 -o blender-5.2.2-linux-x64.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
            tar -xJf blender-5.2.2-linux-x64.tar.xz
          fi
          echo "BLENDER_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Build v0.5.3
        shell: bash
        run: |
          rm -rf cherpg_pipeline/p053 cherpg_pipeline/p054 cherpg_pipeline/preview6
          mkdir -p cherpg_pipeline/p053 cherpg_pipeline/p054 cherpg_pipeline/preview6
          "$BLENDER_BIN" --background --python cherpg_pipeline/cleanup_v053.py -- cherpg_pipeline/cherpg-pawn-protagonist-sculpt-refined-v0.5.2.glb cherpg_pipeline/p053
      - name: Build v0.5.4
        shell: bash
        run: |
          "$BLENDER_BIN" --background cherpg_pipeline/p053/cherpg-pawn-protagonist-blender-ready-v0.5.3.blend --python cherpg_pipeline/rig_v054.py -- cherpg_pipeline/p053/cherpg-pawn-protagonist-blender-ready-v0.5.3.blend cherpg_pipeline/p054
      - name: Render six views
        shell: bash
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_BIN" --background cherpg_pipeline/p054/cherpg-pawn-protagonist-rigged-v0.5.4.blend --python cherpg_pipeline/render_multi_preview_v054.py -- cherpg_pipeline/p054/cherpg-pawn-protagonist-rigged-v0.5.4.blend cherpg_pipeline/preview6
          test "$(find cherpg_pipeline/preview6 -name '*.png' | wc -l)" -eq 6
          ls -lh cherpg_pipeline/preview6
      - name: Commit preview PNGs to branch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p cherpg_pipeline/renders_v054
          cp cherpg_pipeline/preview6/*.png cherpg_pipeline/renders_v054/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cherpg_pipeline/renders_v054/*.png
          git commit -m "Add v0.5.4 six-view render previews" || true
          git push origin HEAD:cherpg-blender-pipeline

      - uses: actions/upload-artifact@v4
        with:
          name: cherpg-pawn-v0.5.4-six-view-preview
          path: cherpg_pipeline/preview6/*.png
          if-no-files-found: error
          retention-days: 30
