name: CheRPG Godot Motion Lab 0.0.6v

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/godot-motion-rotation-testmap-0.0.4v]
    paths:
      - 'godot/testmap-source-0.0.6v.tar.xz.b64'
      - '.github/workflows/cherpg-godot-motion-lab.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  motion-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: feature/godot-motion-rotation-testmap-0.0.4v
      - name: Decode archived source and verify checksum
        shell: bash
        run: |
          set -euo pipefail
          base64 -d godot/testmap-source-0.0.6v.tar.xz.b64 > "$RUNNER_TEMP/motion-lab.tar.xz"
          echo 'b581beede79af41cfa3722838f28024becbee9a36a594d7753139f95dc491dcd  '"$RUNNER_TEMP/motion-lab.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/motion-lab.tar.xz"
          test -f godot/tests/motion_rotation_lab/scenes/MotionLab.tscn
          test -f godot/tests/motion_rotation_lab/scripts/pawn_controller.gd
          test -f godot/tests/motion_rotation_lab/scripts/direction_device.gd
      - name: Apply typed GDScript contacts fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("godot/tests/motion_rotation_lab/scripts/direction_device.gd")
          s=p.read_text()
          changes=[
              ("var xy := pawn.global_position", "var xy: Vector3 = pawn.global_position"),
              ("var world_center := xy", "var world_center: Vector3 = xy"),
              ("var length := COLLAR_Y-", "var length: float = COLLAR_Y-"),
          ]
          for old,new in changes:
              if old in s:
                  s=s.replace(old,new)
              elif new not in s:
                  raise RuntimeError("Expected device geometry declaration missing: "+old)
          p.write_text(s)
          PY
      - name: Add early-failure floor diagnostics
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("godot/tests/motion_rotation_lab/scripts/motion_lab.gd")
          s=p.read_text()
          before='\tassert(pawn.is_on_floor(),"Pawn did not reach ground before anchor test")'
          after = '\tvar ray := PhysicsRayQueryParameters3D.create(pawn.global_position+Vector3.UP*2.0,pawn.global_position+Vector3.DOWN*4.0,1,[pawn.get_rid()])\n\tvar ground_hit: Dictionary = get_world_3d().direct_space_state.intersect_ray(ray)\n\tprint("CHERPG_FLOOR_DIAGNOSTIC position=",pawn.global_position," velocity=",pawn.velocity," grounded=",pawn.is_on_floor()," ray_hit=",ground_hit.get("position","NONE"))\n\tif not pawn.is_on_floor():\n\t\tpush_error("Pawn did not reach ground before anchor test")\n\t\tget_tree().quit(1)\n\t\treturn'
          if before not in s:
              raise RuntimeError("Expected smoke test assertion missing")
          p.write_text(s.replace(before,after))
          PY
      - name: Install Godot 4.5.2 (non-.NET)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.5.2'
          use-dotnet: false
          include-templates: false
      - name: Headless import (fail on script errors)
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          timeout 90s godot --headless --editor --import --path godot/tests/motion_rotation_lab --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error:|Parser Error:|Failed to load script' "$RUNNER_TEMP/import.log"; then
            exit 1
          fi
      - name: Run five terrain/anchor/jump smoke tests
        shell: bash
        run: |
          set -euo pipefail
          timeout 35s godot --headless --path godot/tests/motion_rotation_lab --quit-after 1200 -- --smoke-test 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -F 'CHERPG_GODOT_TESTMAP_SMOKE_OK' "$RUNNER_TEMP/smoke.log"
          if grep -E 'SCRIPT ERROR|Parse Error:|Parser Error:|Assertion failed' "$RUNNER_TEMP/smoke.log"; then
            exit 1
          fi
      - name: Commit expanded readable project source on prototype branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add godot/tests/motion_rotation_lab
          if ! git diff --cached --quiet; then
            git commit -m 'test: publish verified standalone Godot motion lab 0.0.6v'
            git push origin HEAD:feature/godot-motion-rotation-testmap-0.0.4v
          fi
