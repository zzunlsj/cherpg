name: CheRPG Godot Motion Lab (manual tests)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  motion-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out standalone prototype source
        uses: actions/checkout@v4
        with:
          ref: feature/godot-motion-rotation-testmap-0.0.4v
      - name: Confirm isolated test map and Unity movement intent
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('godot/tests/motion_rotation_lab')
          assert (p/'project.godot').exists()
          assert (p/'scenes/MotionLab.tscn').exists()
          move=(p/'scripts/pawn_controller.gd').read_text()
          terrain=(p/'scripts/test_lane.gd').read_text()
          device=(p/'scripts/direction_device.gd').read_text()
          for text in ('INPUT_SMOOTHING_PER_SEC := 10.0','WALK_MPS := 4.0',
                       'RUN_MPS := 6.0','SOURCE_SPRINT_FORCE_MULT := 2.0',
                       'func queue_jump()','func release_jump()'):
              assert text in move,text
          assert 'terrain_shape.backface_collision = true' in terrain
          assert 'var xy: Vector3' in device
          assert 'ANCHOR_ANGLES := [45.0, 135.0, 225.0, 315.0]' in device
          print('CHERPG_GODOT_SOURCE_STRUCTURE_OK')
          PY
      - name: Install Godot 4.7.2
        uses: chickensoft-games/setup-godot@v2
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: false
      - name: Verify Godot parser and scene import
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --editor --import --path godot/tests/motion_rotation_lab --quit 2>&1 | tee "$RUNNER_TEMP/import.log"
          if grep -E 'SCRIPT ERROR|Parse Error:|Parser Error:|Failed to load script' "$RUNNER_TEMP/import.log"; then
            exit 1
          fi
      - name: Run five test lanes, four anchors, jump and landing
        shell: bash
        run: |
          set -euo pipefail
          timeout 35s godot --headless --path godot/tests/motion_rotation_lab --quit-after 1200 -- --smoke-test 2>&1 | tee "$RUNNER_TEMP/smoke.log"
          grep -F 'CHERPG_GODOT_TESTMAP_SMOKE_OK' "$RUNNER_TEMP/smoke.log"
          if grep -E 'SCRIPT ERROR|Parse Error:|Parser Error:|Assertion failed|ERROR:' "$RUNNER_TEMP/smoke.log"; then
            exit 1
          fi
