name: CheRPG v0.5.11 Head Match
on:
  push:
    branches: [cherpg-blender-pipeline]
    paths:
      - 'cherpg_pipeline/head_match_v0511.py'
      - 'cherpg_pipeline/render_head_v0511.py'
      - 'cherpg_pipeline/render_head_v0511_pbr.py'
      - '.github/workflows/cherpg-head-v0511.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cherpg-blender/blender-5.2.2-linux-x64
          key: blender-5.2.2-linux-x64
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libx11-6 libxext6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 xvfb
          ROOT="$HOME/.cache/cherpg-blender";BIN="$ROOT/blender-5.2.2-linux-x64/blender"
          if [ ! -x "$BIN" ];then mkdir -p "$ROOT";cd "$ROOT";curl -fL -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz;tar -xJf blender.tar.xz;fi
          echo "BLENDER_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Rebuild through v0.5.10
        shell: bash
        run: |
          rm -rf cherpg_pipeline/m11_053 cherpg_pipeline/m11_055s cherpg_pipeline/m11_055r cherpg_pipeline/m11_056 cherpg_pipeline/m11_058 cherpg_pipeline/m11_059 cherpg_pipeline/m11_510 cherpg_pipeline/m11_out
          mkdir -p cherpg_pipeline/m11_053 cherpg_pipeline/m11_055s cherpg_pipeline/m11_055r cherpg_pipeline/m11_056 cherpg_pipeline/m11_058 cherpg_pipeline/m11_059 cherpg_pipeline/m11_510 cherpg_pipeline/m11_out
          "$BLENDER_BIN" --background --python cherpg_pipeline/cleanup_v053.py -- cherpg_pipeline/cherpg-pawn-protagonist-sculpt-refined-v0.5.2.glb cherpg_pipeline/m11_053
          "$BLENDER_BIN" --background cherpg_pipeline/m11_053/cherpg-pawn-protagonist-blender-ready-v0.5.3.blend --python cherpg_pipeline/silhouette_v055.py -- cherpg_pipeline/m11_053/cherpg-pawn-protagonist-blender-ready-v0.5.3.blend cherpg_pipeline/m11_055s/shape.blend
          "$BLENDER_BIN" --background cherpg_pipeline/m11_055s/shape.blend --python cherpg_pipeline/rig_v055.py -- cherpg_pipeline/m11_055s/shape.blend cherpg_pipeline/m11_055r
          "$BLENDER_BIN" --background cherpg_pipeline/m11_055r/cherpg-pawn-protagonist-rigged-v0.5.5.blend --python cherpg_pipeline/head_pass_v056.py -- cherpg_pipeline/m11_055r/cherpg-pawn-protagonist-rigged-v0.5.5.blend cherpg_pipeline/m11_056/head056.blend
          "$BLENDER_BIN" --background cherpg_pipeline/m11_056/head056.blend --python cherpg_pipeline/head_rebuild_v058.py -- cherpg_pipeline/m11_056/head056.blend cherpg_pipeline/m11_058/head058.blend
          "$BLENDER_BIN" --background cherpg_pipeline/m11_058/head058.blend --python cherpg_pipeline/head_detail_v059.py -- cherpg_pipeline/m11_058/head058.blend cherpg_pipeline/m11_059/head059.blend
          "$BLENDER_BIN" --background cherpg_pipeline/m11_059/head059.blend --python cherpg_pipeline/head_sculpt_v0510.py -- cherpg_pipeline/m11_059/head059.blend cherpg_pipeline/m11_510/head510.blend
      - name: Apply v0.5.11
        shell: bash
        run: |
          "$BLENDER_BIN" --background cherpg_pipeline/m11_510/head510.blend --python cherpg_pipeline/head_match_v0511.py -- cherpg_pipeline/m11_510/head510.blend cherpg_pipeline/m11_out/cherpg-pawn-protagonist-v0.5.11-head.blend
      - name: Render review
        shell: bash
        run: |
          mkdir -p cherpg_pipeline/m11_out/review
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_BIN" --background cherpg_pipeline/m11_out/cherpg-pawn-protagonist-v0.5.11-head.blend --python cherpg_pipeline/render_head_v0511.py -- cherpg_pipeline/m11_out/cherpg-pawn-protagonist-v0.5.11-head.blend cherpg_pipeline/m11_out/review
      - name: Render PBR
        shell: bash
        run: |
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_BIN" --background cherpg_pipeline/m11_out/cherpg-pawn-protagonist-v0.5.11-head.blend --python cherpg_pipeline/render_head_v0511_pbr.py -- cherpg_pipeline/m11_out/cherpg-pawn-protagonist-v0.5.11-head.blend cherpg_pipeline/m11_out/cherpg-pawn-v0.5.11-head-pbr.png
      - name: Commit renders
        shell: bash
        run: |
          mkdir -p cherpg_pipeline/renders_parts_v0511/head
          cp cherpg_pipeline/m11_out/review/*.png cherpg_pipeline/renders_parts_v0511/head/
          cp cherpg_pipeline/m11_out/cherpg-pawn-v0.5.11-head-pbr.png cherpg_pipeline/renders_parts_v0511/head/
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cherpg_pipeline/renders_parts_v0511/head/*.png
          git commit -m "Add v0.5.11 concept-matched head renders" || true
          git push origin HEAD:cherpg-blender-pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: cherpg-pawn-v0.5.11-head-match
          path: cherpg_pipeline/m11_out/*
          retention-days: 30
