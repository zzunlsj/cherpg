name: CheRPG Pawn Face Blockout v0.0.1
on:
  push:
    branches: [main]
    paths:
      - 'production/pawn_protagonist/modeling/face_blockout_v0001.py'
      - '.github/workflows/cherpg-pawn-face-blockout.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  face:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cherpg-blender/blender-5.2.2-linux-x64
          key: blender-5.2.2-linux-x64
      - name: Install Blender
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libx11-6 libxext6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 xvfb
          ROOT="$HOME/.cache/cherpg-blender";BIN="$ROOT/blender-5.2.2-linux-x64/blender"
          if [ ! -x "$BIN" ];then
            mkdir -p "$ROOT"
            curl -fL -o "$RUNNER_TEMP/blender.tar.xz" https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz
            tar -xJf "$RUNNER_TEMP/blender.tar.xz" -C "$ROOT"
          fi
          echo "BLENDER_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Sculpt head baseline and render three views
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p production/pawn_protagonist/build/face-v0.0.1
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_BIN" --background --python production/pawn_protagonist/modeling/face_blockout_v0001.py -- production/pawn_protagonist/build/face-v0.0.1
          for angle in front profile threequarter; do test -s "production/pawn_protagonist/build/face-v0.0.1/pawn-face-blockout-v0.0.1-${angle}.png"; done
          test -s production/pawn_protagonist/build/face-v0.0.1/pawn-face-blockout-v0.0.1.blend
      - name: Commit review previews
        shell: bash
        run: |
          cp production/pawn_protagonist/build/face-v0.0.1/*.png production/pawn_protagonist/renders/
          cp production/pawn_protagonist/build/face-v0.0.1/report.json production/pawn_protagonist/renders/face-blockout-report.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add production/pawn_protagonist/renders
          if ! git diff --cached --quiet;then git commit -m "Add Pawn face v0.0.1 review renders";git push origin HEAD:main;fi
      - uses: actions/upload-artifact@v4
        with:
          name: pawn-face-blockout-v0.0.1-blend-and-renders
          path: production/pawn_protagonist/build/face-v0.0.1/*
          retention-days: 30
