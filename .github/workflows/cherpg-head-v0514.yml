name: CheRPG v0.5.14 Head Surface
on:
  push:
    branches: [cherpg-blender-pipeline]
    paths:
      - 'cherpg_pipeline/head_surface_v0514.py'
      - 'cherpg_pipeline/render_head_v0514_pbr.py'
      - '.github/workflows/cherpg-head-v0514.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  head:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.cache/cherpg-blender/blender-5.2.2-linux-x64
          key: blender-5.2.2-linux-x64
      - name: Prepare
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libegl1 libgl1 libgl1-mesa-dri libx11-6 libxext6 libxi6 libxfixes3 libxrender1 libxxf86vm1 libxkbcommon0 xvfb
          ROOT="$HOME/.cache/cherpg-blender";BIN="$ROOT/blender-5.2.2-linux-x64/blender"
          if [ ! -x "$BIN" ];then mkdir -p "$ROOT";cd "$ROOT";curl -fL -o blender.tar.xz https://download.blender.org/release/Blender5.2/blender-5.2.2-linux-x64.tar.xz;tar -xJf blender.tar.xz;fi
          echo "BLENDER_BIN=$BIN" >> "$GITHUB_ENV"
      - name: Rebuild through v0.5.13
        shell: bash
        run: |
          rm -rf cherpg_pipeline/s14 && mkdir -p cherpg_pipeline/s14/{053,055s,055r,056,058,059,510,511,512,513,514}
          "$BLENDER_BIN" --background --python cherpg_pipeline/cleanup_v053.py -- cherpg_pipeline/cherpg-pawn-protagonist-sculpt-refined-v0.5.2.glb cherpg_pipeline/s14/053
          "$BLENDER_BIN" --background cherpg_pipeline/s14/053/cherpg-pawn-protagonist-blender-ready-v0.5.3.blend --python cherpg_pipeline/silhouette_v055.py -- cherpg_pipeline/s14/053/cherpg-pawn-protagonist-blender-ready-v0.5.3.blend cherpg_pipeline/s14/055s/shape.blend
          "$BLENDER_BIN" --background cherpg_pipeline/s14/055s/shape.blend --python cherpg_pipeline/rig_v055.py -- cherpg_pipeline/s14/055s/shape.blend cherpg_pipeline/s14/055r
          "$BLENDER_BIN" --background cherpg_pipeline/s14/055r/cherpg-pawn-protagonist-rigged-v0.5.5.blend --python cherpg_pipeline/head_pass_v056.py -- cherpg_pipeline/s14/055r/cherpg-pawn-protagonist-rigged-v0.5.5.blend cherpg_pipeline/s14/056/head056.blend
          "$BLENDER_BIN" --background cherpg_pipeline/s14/056/head056.blend --python cherpg_pipeline/head_rebuild_v058.py -- cherpg_pipeline/s14/056/head056.blend cherpg_pipeline/s14/058/head058.blend
          "$BLENDER_BIN" --background cherpg_pipeline/s14/058/head058.blend --python cherpg_pipeline/head_detail_v059.py -- cherpg_pipeline/s14/058/head058.blend cherpg_pipeline/s14/059/head059.blend
          "$BLENDER_BIN" --background cherpg_pipeline/s14/059/head059.blend --python cherpg_pipeline/head_sculpt_v0510.py -- cherpg_pipeline/s14/059/head059.blend cherpg_pipeline/s14/510/head510.blend
          "$BLENDER_BIN" --background cherpg_pipeline/s14/510/head510.blend --python cherpg_pipeline/head_match_v0511.py -- cherpg_pipeline/s14/510/head510.blend cherpg_pipeline/s14/511/head511.blend
          "$BLENDER_BIN" --background cherpg_pipeline/s14/511/head511.blend --python cherpg_pipeline/head_polish_v0512.py -- cherpg_pipeline/s14/511/head511.blend cherpg_pipeline/s14/512/head512.blend
          "$BLENDER_BIN" --background cherpg_pipeline/s14/512/head512.blend --python cherpg_pipeline/head_clean_v0513.py -- cherpg_pipeline/s14/512/head512.blend cherpg_pipeline/s14/513/head513.blend
      - name: Apply surface pass
        shell: bash
        run: |
          "$BLENDER_BIN" --background cherpg_pipeline/s14/513/head513.blend --python cherpg_pipeline/head_surface_v0514.py -- cherpg_pipeline/s14/513/head513.blend cherpg_pipeline/s14/514/cherpg-pawn-protagonist-v0.5.14-head.blend
      - name: Render head only
        shell: bash
        run: |
          mkdir -p cherpg_pipeline/s14/514/renders
          LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a "$BLENDER_BIN" --background cherpg_pipeline/s14/514/cherpg-pawn-protagonist-v0.5.14-head.blend --python cherpg_pipeline/render_head_v0514_pbr.py -- cherpg_pipeline/s14/514/cherpg-pawn-protagonist-v0.5.14-head.blend cherpg_pipeline/s14/514/renders
      - name: Commit
        shell: bash
        run: |
          mkdir -p cherpg_pipeline/renders_parts_v0514/head
          cp cherpg_pipeline/s14/514/renders/*.png cherpg_pipeline/renders_parts_v0514/head/
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cherpg_pipeline/renders_parts_v0514/head/*.png
          git commit -m "Add v0.5.14 head-only surface renders" || true
          git push origin HEAD:cherpg-blender-pipeline
      - uses: actions/upload-artifact@v4
        with:
          name: cherpg-pawn-v0.5.14-head-surface
          path: cherpg_pipeline/s14/514/*
          retention-days: 30
