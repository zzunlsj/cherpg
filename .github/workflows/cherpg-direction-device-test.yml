name: CheRPG Direction Device 0.0.3v Verification

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/cherpg-direction-device-test.yml'
      - 'production/pawn_protagonist/modeling/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ground-contact:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check four feet and safety rejection
        run: python3 production/pawn_protagonist/modeling/test_ground_contact.py
      - name: Check syntax
        run: python3 -m py_compile production/pawn_protagonist/modeling/direction_contact_solver.py production/pawn_protagonist/modeling/pawn_direction_device_0_0_3v.py

  blender-model:
    needs: ground-contact
    uses: ./.github/workflows/cherpg-blender-tool.yml
    with:
      action: run_script
      script_path: production/pawn_protagonist/modeling/pawn_direction_device_0_0_3v.py

  check-blender-exports:
    needs: blender-model
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cherpg-blender-tool-result
          path: blender-results
      - name: Validate actual Blender output files
        shell: bash
        run: |
          set -euo pipefail
          test -s blender-results/pawn-direction-device-0.0.3v.blend
          test -s blender-results/pawn-direction-device-animated-0.0.3v.glb
          test -s blender-results/direction-grounding-0.0.3v.json
          python3 - <<'PY'
          import json, pathlib, struct
          root=pathlib.Path("blender-results")
          data=json.loads((root/"direction-grounding-0.0.3v.json").read_text())
          assert data["all_anchors_supported"] and data["steep_terrain_rejected"]
          assert data["pawn_body_rotates"] is False
          assert len(data["foot_contacts"]) == 4
          glb=(root/"pawn-direction-device-animated-0.0.3v.glb").read_bytes()
          assert glb[:4] == b"glTF" and struct.unpack("<I",glb[4:8])[0] == 2
          print("CHERPG_BLENDER_GLTF_EXPORT_VERIFIED",len(glb))
          PY
